<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espacio Kihnally - Bienvenida</title>
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1410;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            margin: 0;
            position: relative;
        }

        /* ===== CONTENEDOR PRINCIPAL (para el fade) ===== */
        .contenedor-principal {
            max-width: 800px;
            width: 100%;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 1;
            transform: scale(1);
        }

        .contenedor-principal.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* ===== CONTENEDOR DEL VIDEO ===== */
        .contenedor-video {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            aspect-ratio: 16 / 9;
            position: relative;
        }

        .contenedor-video iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== MENSAJE DE CARGA ===== */
        .info-carga {
            color: #f5ede4;
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.6;
            letter-spacing: 1px;
            transition: opacity 0.5s;
        }

        .info-carga.oculto {
            opacity: 0;
        }

        .info-carga span {
            display: inline-block;
            animation: puntos 1.4s infinite;
        }

        @keyframes puntos {
            0%, 20% { opacity: 0; }
            40% { opacity: 1; }
            100% { opacity: 1; }
        }

        /* ===== SOBREPOSICIÓN DE FADE ===== */
        .overlay-fade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1410;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 1s ease;
        }

        .overlay-fade.activo {
            opacity: 1;
        }

        /* ===== MENSAJE DE REDIRECCIÓN ===== */
        .mensaje-redireccion {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4a373;
            font-size: 1.5em;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            text-align: center;
        }

        .mensaje-redireccion.activo {
            opacity: 1;
        }

        .mensaje-redireccion small {
            display: block;
            font-size: 0.5em;
            font-weight: normal;
            color: #f5ede4;
            margin-top: 10px;
            opacity: 0.6;
        }

        /* ===== FALLBACK ===== */
        .fallback {
            display: none;
            color: #f5ede4;
            background: #2a1f18;
            padding: 30px 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #4a3a30;
            max-width: 500px;
        }

        .fallback a {
            color: #d4a373;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid #d4a373;
            padding-bottom: 2px;
        }

        .fallback a:hover {
            color: #e8c9a0;
        }

        .pie-pagina {
            color: #4a3a30;
            font-size: 0.7em;
            margin-top: 40px;
            letter-spacing: 2px;
        }

        /* ===== BARRA DE PROGRESO (opcional, para feedback visual) ===== */
        .barra-progreso {
            width: 100%;
            max-width: 800px;
            height: 3px;
            background: #2a1f18;
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .barra-progreso.visible {
            opacity: 0.6;
        }

        .barra-progreso .relleno {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4a373, #e8c9a0);
            border-radius: 2px;
            transition: width 0.3s linear;
        }
    </style>
</head>

<body>

    <!-- ===== OVERLAY PARA EL FADE ===== -->
    <div class="overlay-fade" id="overlayFade"></div>

    <!-- ===== MENSAJE DE REDIRECCIÓN ===== -->
    <div class="mensaje-redireccion" id="mensajeRedireccion">
        ✦ Espacio Kihnally ✦
        <small>Preparando tu experiencia...</small>
    </div>

    <!-- ===== CONTENEDOR PRINCIPAL ===== -->
    <div class="contenedor-principal" id="contenedorPrincipal">

        <!-- ===== VIDEO DE YOUTUBE ===== -->
        <div class="contenedor-video">
            <iframe
                id="videoYouTube"
                src="https://www.youtube.com/embed/TVKgM2zZqy4?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>
        </div>

        <!-- ===== BARRA DE PROGRESO ===== -->
        <div class="barra-progreso" id="barraProgreso">
            <div class="relleno" id="rellenoProgreso"></div>
        </div>

        <!-- ===== MENSAJE DE CARGA ===== -->
        <div class="info-carga" id="infoCarga">
            <span>●</span> Cargando video de bienvenida <span>●</span>
        </div>

        <!-- ===== FALLBACK ===== -->
        <div class="fallback" id="fallback">
            <p>⏳ El video no se pudo cargar automáticamente</p>
            <p style="margin-top:10px;">
                Haz clic aquí para ir directamente al
                <a href="https://espacio-kihnally.ola.click/products">menú de Espacio Kihnally</a>
            </p>
        </div>

        <div class="pie-pagina">ESPACIO KIHNALLY</div>
    </div>

    <!-- ===== JAVASCRIPT (Método mejorado sin API de YouTube) ===== -->
    <script>
        // ===== CONFIGURACIÓN =====
        const URL_MENU = 'https://espacio-kihnally.ola.click/products';
        let redireccionRealizada = false;
        let videoCargado = false;
        let tiempoInicio = 0;
        let duracionEstimada = 0;
        let intervaloProgreso = null;

        // ===== ELEMENTOS DOM =====
        const contenedorPrincipal = document.getElementById('contenedorPrincipal');
        const overlayFade = document.getElementById('overlayFade');
        const mensajeRedireccion = document.getElementById('mensajeRedireccion');
        const infoCarga = document.getElementById('infoCarga');
        const fallback = document.getElementById('fallback');
        const barraProgreso = document.getElementById('barraProgreso');
        const rellenoProgreso = document.getElementById('rellenoProgreso');
        const iframe = document.getElementById('videoYouTube');

        // ===== FUNCIÓN: INICIAR EFECTO FADE Y REDIRIGIR =====
        function iniciarFadeYRedirigir() {
            if (redireccionRealizada) return;
            redireccionRealizada = true;

            console.log('✨ Iniciando efecto fade...');

            // Limpiar intervalo de progreso
            if (intervaloProgreso) {
                clearInterval(intervaloProgreso);
                intervaloProgreso = null;
            }

            // Ocultar barra de progreso
            barraProgreso.classList.remove('visible');

            // 1. Ocultar el contenido principal con fade
            contenedorPrincipal.classList.add('fade-out');

            // 2. Activar el overlay oscuro
            setTimeout(() => {
                overlayFade.classList.add('activo');
            }, 200);

            // 3. Mostrar el mensaje de redirección
            setTimeout(() => {
                mensajeRedireccion.classList.add('activo');
            }, 500);

            // 4. Redirigir después de que el fade esté completo
            setTimeout(() => {
                console.log('🔄 Redirigiendo al menú...');
                window.location.href = URL_MENU;
            }, 1500);
        }

        // ===== MÉTODO 1: DETECTAR FIN DEL VIDEO CON POSTMESSAGE =====
        function detectarFinConPostMessage() {
            // Escuchar mensajes del iframe de YouTube
            window.addEventListener('message', function(event) {
                // Verificar que el mensaje viene de YouTube
                if (event.origin === 'https://www.youtube.com') {
                    try {
                        const data = JSON.parse(event.data);
                        // YouTube envía eventos de estado
                        // info: 0 = terminado, 1 = reproduciendo, 2 = pausado
                        if (data.event === 'onStateChange' && data.info === 0) {
                            console.log('✅ Video terminado (detectado por postMessage)');
                            iniciarFadeYRedirigir();
                        }
                        // Si el video comienza a reproducirse, registrar tiempo
                        if (data.event === 'onStateChange' && data.info === 1) {
                            if (!videoCargado) {
                                videoCargado = true;
                                tiempoInicio = Date.now();
                                infoCarga.classList.add('oculto');
                                barraProgreso.classList.add('visible');
                                console.log('▶️ Video comenzó a reproducirse');
                            }
                        }
                    } catch (e) {
                        // Ignorar mensajes que no sean JSON
                    }
                }
            });
        }

        // ===== MÉTODO 2: DETECTAR FIN CON MUTATION OBSERVER (FALLBACK) =====
        function detectarFinConObserver() {
            // Este método observa cambios en el iframe para detectar cuando el video termina
            let ultimoEstado = '';
            
            const observer = new MutationObserver(function() {
                try {
                    // Intentar obtener el estado del video desde el iframe
                    // Nota: Esto puede no funcionar en todos los navegadores
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow?.document;
                    if (iframeDoc) {
                        // Buscar el elemento del video dentro del iframe
                        const videoElement = iframeDoc.querySelector('video');
                        if (videoElement) {
                            if (videoElement.ended && !redireccionRealizada) {
                                console.log('✅ Video terminado (detectado por Observer)');
                                iniciarFadeYRedirigir();
                            }
                            if (!videoCargado && videoElement.currentTime > 0) {
                                videoCargado = true;
                                tiempoInicio = Date.now();
                                infoCarga.classList.add('oculto');
                                barraProgreso.classList.add('visible');
                                console.log('▶️ Video comenzó (detectado por Observer)');
                            }
                        }
                    }
                } catch (e) {
                    // Error de CORS, ignorar
                }
            });

            // Observar cambios en el iframe
            try {
                observer.observe(iframe, {
                    attributes: true,
                    attributeFilter: ['src']
                });
            } catch (e) {
                console.log('Observer no disponible');
            }
        }

        // ===== MÉTODO 3: FALLBACK POR DURACIÓN ESTIMADA =====
        function detectarFinPorDuracion() {
            // Intentar obtener la duración del video desde la URL
            // La duración del video "TVKgM2zZqy4" es de aproximadamente 60 segundos
            // Pero la detectaremos dinámicamente
            
            let intentos = 0;
            const maxIntentos = 20; // 20 segundos máximo para detectar
            
            const intervaloDuracion = setInterval(() => {
                intentos++;
                
                // Intentar obtener la duración del video de YouTube
                // Usamos la API de oEmbed de YouTube (pública)
                if (intentos === 1) {
                    fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=TVKgM2zZqy4&format=json')
                        .then(response => response.json())
                        .then(data => {
                            // La duración no viene en oEmbed, pero podemos usar el título
                            console.log('📹 Video cargado desde oEmbed');
                        })
                        .catch(() => {
                            console.log('No se pudo obtener información del video');
                        });
                }
                
                // Si el video ya se está reproduciendo, calcular tiempo estimado
                if (videoCargado) {
                    const tiempoTranscurrido = (Date.now() - tiempoInicio) / 1000;
                    
                    // Actualizar barra de progreso (estimada)
                    const progreso = Math.min((tiempoTranscurrido / 60) * 100, 95);
                    rellenoProgreso.style.width = progreso + '%';
                    
                    // Si han pasado más de 60 segundos, asumir que el video terminó
                    if (tiempoTranscurrido > 65 && !redireccionRealizada) {
                        clearInterval(intervaloDuracion);
                        console.log('⏰ Redirección por tiempo estimado (65s)');
                        iniciarFadeYRedirigir();
                    }
                }
                
                // Si pasaron 20 segundos y el video no cargó, mostrar fallback
                if (intentos > 20 && !videoCargado && !redireccionRealizada) {
                    clearInterval(intervaloDuracion);
                    if (!fallback.style.display || fallback.style.display === 'none') {
                        fallback.style.display = 'block';
                        infoCarga.textContent = '⏳ El video está tardando en cargar';
                    }
                }
            }, 1000);
        }

        // ===== MÉTODO 4: DETECCIÓN POR CLIC DEL USUARIO (SOLO PARA MÓVILES) =====
        function detectarInteraccionUsuario() {
            // En móviles, el autoplay a veces no funciona
            // Si el usuario hace clic/toca, intentamos reproducir
            document.addEventListener('click', function() {
                if (!videoCargado && !redireccionRealizada) {
                    // Intentar forzar la reproducción enviando un mensaje al iframe
                    try {
                        iframe.contentWindow.postMessage(
                            '{"event":"command","func":"playVideo","args":""}',
                            'https://www.youtube.com'
                        );
                        console.log('📱 Intentando reproducir por interacción del usuario');
                    } catch (e) {
                        // Ignorar errores
                    }
                }
            });
        }

        // ===== INICIALIZAR TODOS LOS MÉTODOS DE DETECCIÓN =====
        function iniciarDeteccion() {
            console.log('🚀 Iniciando detección del fin del video...');
            
            // Método 1: PostMessage (más confiable)
            detectarFinConPostMessage();
            
            // Método 2: Observer (fallback)
            detectarFinConObserver();
            
            // Método 3: Duración estimada (último recurso)
            detectarFinPorDuracion();
            
            // Método 4: Interacción del usuario (para móviles)
            detectarInteraccionUsuario();
            
            // Fallback general: después de 90 segundos, redirigir forzosamente
            setTimeout(() => {
                if (!redireccionRealizada) {
                    console.log('⏰ Fallback general: 90 segundos alcanzados');
                    iniciarFadeYRedirigir();
                }
            }, 90000);
        }

        // ===== INICIAR =====
        iniciarDeteccion();

        // Mostrar mensaje en consola
        console.log('📺 Video ID: TVKgM2zZqy4');
        console.log('🔗 Redirigirá a: ' + URL_MENU);
        console.log('⏳ Esperando que termine el video...');
    </script>
</body>
</html>
