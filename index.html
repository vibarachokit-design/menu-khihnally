<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espacio Kihnally - Bienvenida</title>
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1410;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            margin: 0;
            position: relative;
        }

        /* ===== CONTENEDOR PRINCIPAL (para el fade) ===== */
        .contenedor-principal {
            max-width: 800px;
            width: 100%;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 1;
            transform: scale(1);
        }

        .contenedor-principal.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* ===== CONTENEDOR DEL VIDEO ===== */
        .contenedor-video {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            aspect-ratio: 16 / 9;
            position: relative;
        }

        .contenedor-video iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== MENSAJE DE CARGA ===== */
        .info-carga {
            color: #f5ede4;
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.6;
            letter-spacing: 1px;
            transition: opacity 0.5s;
        }

        .info-carga.oculto {
            opacity: 0;
        }

        .info-carga span {
            display: inline-block;
            animation: puntos 1.4s infinite;
        }

        @keyframes puntos {
            0%, 20% { opacity: 0; }
            40% { opacity: 1; }
            100% { opacity: 1; }
        }

        /* ===== SOBREPOSICIÓN DE FADE ===== */
        .overlay-fade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1410;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 1s ease;
        }

        .overlay-fade.activo {
            opacity: 1;
        }

        /* ===== MENSAJE DE REDIRECCIÓN ===== */
        .mensaje-redireccion {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4a373;
            font-size: 1.5em;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            text-align: center;
        }

        .mensaje-redireccion.activo {
            opacity: 1;
        }

        .mensaje-redireccion small {
            display: block;
            font-size: 0.5em;
            font-weight: normal;
            color: #f5ede4;
            margin-top: 10px;
            opacity: 0.6;
        }

        /* ===== BARRA DE PROGRESO ===== */
        .barra-progreso {
            width: 100%;
            max-width: 800px;
            height: 4px;
            background: #2a1f18;
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .barra-progreso.visible {
            opacity: 0.8;
        }

        .barra-progreso .relleno {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4a373, #e8c9a0);
            border-radius: 2px;
            transition: width 0.3s linear;
        }

        /* ===== CONTADOR DE TIEMPO ===== */
        .contador-tiempo {
            color: #4a3a30;
            font-size: 0.8em;
            margin-top: 10px;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .contador-tiempo.visible {
            opacity: 0.6;
        }

        /* ===== FALLBACK ===== */
        .fallback {
            display: none;
            color: #f5ede4;
            background: #2a1f18;
            padding: 30px 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #4a3a30;
            max-width: 500px;
        }

        .fallback a {
            color: #d4a373;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid #d4a373;
            padding-bottom: 2px;
        }

        .fallback a:hover {
            color: #e8c9a0;
        }

        .pie-pagina {
            color: #4a3a30;
            font-size: 0.7em;
            margin-top: 40px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <!-- ===== OVERLAY PARA EL FADE ===== -->
    <div class="overlay-fade" id="overlayFade"></div>

    <!-- ===== MENSAJE DE REDIRECCIÓN ===== -->
    <div class="mensaje-redireccion" id="mensajeRedireccion">
        ✦ Espacio Kihnally ✦
        <small>Preparando tu experiencia...</small>
    </div>

    <!-- ===== CONTENEDOR PRINCIPAL ===== -->
    <div class="contenedor-principal" id="contenedorPrincipal">

        <!-- ===== VIDEO DE YOUTUBE ===== -->
        <div class="contenedor-video">
            <iframe
                id="videoYouTube"
                src="https://www.youtube.com/embed/TVKgM2zZqy4?autoplay=1&rel=0&modestbranding=1&playsinline=1"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>
        </div>

        <!-- ===== BARRA DE PROGRESO ===== -->
        <div class="barra-progreso" id="barraProgreso">
            <div class="relleno" id="rellenoProgreso"></div>
        </div>

        <!-- ===== CONTADOR DE TIEMPO ===== -->
        <div class="contador-tiempo" id="contadorTiempo">⏳ 0s / 12s</div>

        <!-- ===== MENSAJE DE CARGA ===== -->
        <div class="info-carga" id="infoCarga">
            <span>●</span> Cargando video de bienvenida <span>●</span>
        </div>

        <!-- ===== FALLBACK ===== -->
        <div class="fallback" id="fallback">
            <p>⏳ ¿El video no se reproduce?</p>
            <p style="margin-top:10px;">
                Haz clic aquí para ir directamente al
                <a href="https://espacio-kihnally.ola.click/products">menú de Espacio Kihnally</a>
            </p>
        </div>

        <div class="pie-pagina">ESPACIO KIHNALLY</div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== CONFIGURACIÓN =====
        const URL_MENU = 'https://espacio-kihnally.ola.click/products';
        const TIEMPO_REDIRECCION = 12; // segundos
        let redireccionRealizada = false;
        let segundosTranscurridos = 0;

        // ===== ELEMENTOS DOM =====
        const contenedorPrincipal = document.getElementById('contenedorPrincipal');
        const overlayFade = document.getElementById('overlayFade');
        const mensajeRedireccion = document.getElementById('mensajeRedireccion');
        const infoCarga = document.getElementById('infoCarga');
        const fallback = document.getElementById('fallback');
        const barraProgreso = document.getElementById('barraProgreso');
        const rellenoProgreso = document.getElementById('rellenoProgreso');
        const contadorTiempo = document.getElementById('contadorTiempo');

        // ===== FUNCIÓN: INICIAR EFECTO FADE Y REDIRIGIR =====
        function iniciarFadeYRedirigir() {
            if (redireccionRealizada) return;
            redireccionRealizada = true;

            console.log('✨ Iniciando efecto fade...');

            // Ocultar barra de progreso y contador
            barraProgreso.classList.remove('visible');
            contadorTiempo.classList.remove('visible');

            // 1. Ocultar el contenido principal con fade
            contenedorPrincipal.classList.add('fade-out');

            // 2. Activar el overlay oscuro
            setTimeout(() => {
                overlayFade.classList.add('activo');
            }, 200);

            // 3. Mostrar el mensaje de redirección
            setTimeout(() => {
                mensajeRedireccion.classList.add('activo');
            }, 500);

            // 4. Redirigir después de que el fade esté completo
            setTimeout(() => {
                console.log('🔄 Redirigiendo al menú...');
                window.location.href = URL_MENU;
            }, 1500);
        }

        // ===== INICIAR CONTADOR Y PROGRESO =====
        function iniciarContador() {
            // Mostrar barra de progreso y contador
            barraProgreso.classList.add('visible');
            contadorTiempo.classList.add('visible');
            
            // Ocultar mensaje de carga
            infoCarga.classList.add('oculto');

            // Actualizar cada segundo
            const intervalo = setInterval(() => {
                segundosTranscurridos++;
                
                // Calcular progreso (0% a 100% en 12 segundos)
                const progreso = Math.min((segundosTranscurridos / TIEMPO_REDIRECCION) * 100, 100);
                rellenoProgreso.style.width = progreso + '%';
                
                // Actualizar contador
                contadorTiempo.textContent = `⏳ ${segundosTranscurridos}s / ${TIEMPO_REDIRECCION}s`;

                console.log(`⏱️ ${segundosTranscurridos}s de ${TIEMPO_REDIRECCION}s`);

                // Cuando llegue a los 12 segundos, redirigir
                if (segundosTranscurridos >= TIEMPO_REDIRECCION) {
                    clearInterval(intervalo);
                    console.log('✅ Tiempo completado, redirigiendo...');
                    iniciarFadeYRedirigir();
                }
            }, 1000);
        }

        // ===== DETECTAR CUANDO EL VIDEO COMIENZA A REPRODUCIRSE =====
        function detectarInicioVideo() {
            // Intentar detectar cuando el video comienza
            let intentos = 0;
            const maxIntentos = 10; // 10 segundos de espera
            
            const verificar = setInterval(() => {
                intentos++;
                
                // Si el video ya se está reproduciendo, iniciar contador
                if (!redireccionRealizada) {
                    // Si han pasado 3 segundos, asumir que el video está reproduciéndose
                    if (intentos >= 3) {
                        clearInterval(verificar);
                        if (!redireccionRealizada) {
                            console.log('▶️ Video en reproducción, iniciando contador...');
                            iniciarContador();
                        }
                    }
                }
            }, 1000);
        }

        // ===== INICIAR =====
        console.log('🚀 Página de bienvenida cargada');
        console.log(`⏱️ Redirigirá automáticamente en ${TIEMPO_REDIRECCION} segundos`);
        console.log('🔗 Menú: ' + URL_MENU);

        // Iniciar detección del video
        detectarInicioVideo();

        // ===== FALLBACK: Si el video no carga, mostrar opción =====
        setTimeout(() => {
            if (!redireccionRealizada && segundosTranscurridos === 0) {
                fallback.style.display = 'block';
                infoCarga.textContent = '⏳ El video está tardando en cargar';
            }
        }, 8000);

        // ===== FALLBACK: Redirigir forzosamente a los 15 segundos =====
        setTimeout(() => {
            if (!redireccionRealizada) {
                console.log('⏰ Fallback: 15 segundos alcanzados, redirigiendo...');
                iniciarFadeYRedirigir();
            }
        }, 15000);

        // ===== PERMITIR QUE EL USUARIO HAGA CLIC PARA SALTAR =====
        // Si el usuario hace clic en el video o en la página, y han pasado más de 3 segundos,
        // mostramos un mensaje para que pueda ir al menú
        document.addEventListener('click', function() {
            if (segundosTranscurridos > 3 && !redireccionRealizada) {
                if (!fallback.style.display || fallback.style.display === 'none') {
                    fallback.innerHTML = `
                        <p>⏳ ¿Quieres ir al menú ahora?</p>
                        <p style="margin-top:10px;">
                            <a href="${URL_MENU}" style="
                                display: inline-block;
                                background: #d4a373;
                                color: #1a1410;
                                padding: 10px 30px;
                                border-radius: 50px;
                                text-decoration: none;
                                font-weight: bold;
                            ">Ir al menú →</a>
                        </p>
                    `;
                    fallback.style.display = 'block';
                }
            }
        });

        console.log('✅ Sistema listo. Esperando ' + TIEMPO_REDIRECCION + ' segundos...');
    </script>
</body>
</html>
