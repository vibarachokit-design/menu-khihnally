<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espacio Kihnally - Bienvenida</title>
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1410;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            margin: 0;
            position: relative;
        }

        /* ===== CONTENEDOR PRINCIPAL (para el fade) ===== */
        .contenedor-principal {
            max-width: 800px;
            width: 100%;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 1;
            transform: scale(1);
        }

        .contenedor-principal.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* ===== CONTENEDOR DEL VIDEO ===== */
        .contenedor-video {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            aspect-ratio: 16 / 9;
        }

        .contenedor-video iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== MENSAJE DE CARGA ===== */
        .info-carga {
            color: #f5ede4;
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.6;
            letter-spacing: 1px;
            transition: opacity 0.5s;
        }

        .info-carga.oculto {
            opacity: 0;
        }

        .info-carga span {
            display: inline-block;
            animation: puntos 1.4s infinite;
        }

        @keyframes puntos {
            0%, 20% { opacity: 0; }
            40% { opacity: 1; }
            100% { opacity: 1; }
        }

        /* ===== SOBREPOSICIÓN DE FADE (capa extra para un efecto más dramático) ===== */
        .overlay-fade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1410;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 1s ease;
        }

        .overlay-fade.activo {
            opacity: 1;
        }

        /* ===== MENSAJE DE REDIRECCIÓN (opcional, aparece durante el fade) ===== */
        .mensaje-redireccion {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4a373;
            font-size: 1.5em;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            text-align: center;
        }

        .mensaje-redireccion.activo {
            opacity: 1;
        }

        .mensaje-redireccion small {
            display: block;
            font-size: 0.5em;
            font-weight: normal;
            color: #f5ede4;
            margin-top: 10px;
            opacity: 0.6;
        }

        /* ===== FALLBACK (SI EL VIDEO FALLA) ===== */
        .fallback {
            display: none;
            color: #f5ede4;
            background: #2a1f18;
            padding: 30px 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #4a3a30;
            max-width: 500px;
        }

        .fallback a {
            color: #d4a373;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid #d4a373;
            padding-bottom: 2px;
        }

        .fallback a:hover {
            color: #e8c9a0;
        }

        .pie-pagina {
            color: #4a3a30;
            font-size: 0.7em;
            margin-top: 40px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <!-- ===== OVERLAY PARA EL FADE ===== -->
    <div class="overlay-fade" id="overlayFade"></div>

    <!-- ===== MENSAJE DE REDIRECCIÓN (aparece durante el fade) ===== -->
    <div class="mensaje-redireccion" id="mensajeRedireccion">
        ✦ Espacio Kihnally ✦
        <small>Preparando tu experiencia...</small>
    </div>

    <!-- ===== CONTENEDOR PRINCIPAL (TODO EL CONTENIDO) ===== -->
    <div class="contenedor-principal" id="contenedorPrincipal">

        <!-- ===== VIDEO DE YOUTUBE ===== -->
        <div class="contenedor-video">
            <iframe
                id="videoYouTube"
                src="https://www.youtube.com/embed/TVKgM2zZqy4?autoplay=1&rel=0&modestbranding=1&playsinline=1"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>
        </div>

        <!-- ===== MENSAJE DE CARGA ===== -->
        <div class="info-carga" id="infoCarga">
            <span>●</span> Cargando video de bienvenida <span>●</span>
        </div>

        <!-- ===== MENSAJE DE FALLBACK (solo si el video no carga) ===== -->
        <div class="fallback" id="fallback">
            <p>⏳ El video no se pudo cargar automáticamente</p>
            <p style="margin-top:10px;">
                Haz clic aquí para ir directamente al
                <a href="https://espacio-kihnally.ola.click/products">menú de Espacio Kihnally</a>
            </p>
        </div>

        <div class="pie-pagina">ESPACIO KIHNALLY</div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== CONFIGURACIÓN =====
        const URL_MENU = 'https://espacio-kihnally.ola.click/products';
        let redireccionRealizada = false;
        let tiempoEspera = 0;
        const TIEMPO_MAXIMO = 120;
        let playerReady = false;
        let duracionVideo = 0;

        // ===== ELEMENTOS DOM =====
        const contenedorPrincipal = document.getElementById('contenedorPrincipal');
        const overlayFade = document.getElementById('overlayFade');
        const mensajeRedireccion = document.getElementById('mensajeRedireccion');
        const infoCarga = document.getElementById('infoCarga');
        const fallback = document.getElementById('fallback');

        // ===== FUNCIÓN: INICIAR EFECTO FADE Y REDIRIGIR =====
        function iniciarFadeYRedirigir() {
            if (redireccionRealizada) return;
            redireccionRealizada = true;

            console.log('✨ Iniciando efecto fade...');

            // 1. Ocultar el contenido principal con fade
            contenedorPrincipal.classList.add('fade-out');

            // 2. Activar el overlay oscuro
            setTimeout(() => {
                overlayFade.classList.add('activo');
            }, 200);

            // 3. Mostrar el mensaje de redirección
            setTimeout(() => {
                mensajeRedireccion.classList.add('activo');
            }, 500);

            // 4. Redirigir después de que el fade esté completo
            setTimeout(() => {
                console.log('🔄 Redirigiendo al menú...');
                window.location.href = URL_MENU;
            }, 1500); // 1.5 segundos de fade antes de redirigir
        }

        // ===== CARGAR API DE YOUTUBE =====
        function cargarAPIYouTube() {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        // ===== CUANDO LA API ESTÁ LISTA =====
        window.onYouTubeIframeAPIReady = function() {
            const player = new YT.Player('videoYouTube', {
                events: {
                    // ===== EVENTO: CUANDO EL VIDEO TERMINA =====
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.ENDED) {
                            console.log('✅ Video terminado, iniciando fade...');
                            iniciarFadeYRedirigir();
                        }
                    },

                    // ===== EVENTO: CUANDO EL VIDEO ESTÁ LISTO =====
                    'onReady': function() {
                        console.log('✅ Video listo para reproducirse');
                        playerReady = true;
                        infoCarga.classList.add('oculto');

                        try {
                            duracionVideo = player.getDuration();
                            console.log(`📹 Duración del video: ${duracionVideo} segundos`);

                            if (duracionVideo && duracionVideo > 0) {
                                const tiempoExtra = 2000;
                                const tiempoTotal = (duracionVideo * 1000) + tiempoExtra;

                                setTimeout(() => {
                                    if (!redireccionRealizada) {
                                        console.log('⏰ Redirección por tiempo estimado (fallback)');
                                        iniciarFadeYRedirigir();
                                    }
                                }, tiempoTotal);
                            }
                        } catch (e) {
                            console.warn('⚠️ No se pudo obtener la duración del video');
                        }
                    },

                    // ===== EVENTO: SI HAY ERROR EN EL VIDEO =====
                    'onError': function(error) {
                        console.error('❌ Error en YouTube:', error);
                        fallback.style.display = 'block';
                        infoCarga.textContent = '⚠️ Error al cargar el video';

                        setTimeout(() => {
                            if (!redireccionRealizada) {
                                console.log('🔄 Redirigiendo por error en el video');
                                iniciarFadeYRedirigir();
                            }
                        }, 3000);
                    }
                }
            });
        };

        // ===== INICIAR CARGA DE LA API =====
        cargarAPIYouTube();

        // ===== FALLBACK POR TIEMPO MÁXIMO =====
        const intervalo = setInterval(() => {
            tiempoEspera++;

            if (tiempoEspera >= TIEMPO_MAXIMO && !redireccionRealizada) {
                clearInterval(intervalo);
                console.log('⏰ Tiempo máximo alcanzado');
                iniciarFadeYRedirigir();
            }

            if (tiempoEspera % 15 === 0 && tiempoEspera > 0 && !redireccionRealizada && !playerReady) {
                infoCarga.textContent = `⏳ Cargando video... ${tiempoEspera}s`;
            }
        }, 1000);

        // ===== FALLBACK ADICIONAL: clic si el video no carga =====
        document.addEventListener('click', function() {
            if (tiempoEspera > 8 && !redireccionRealizada && !playerReady) {
                if (!fallback.style.display || fallback.style.display === 'none') {
                    fallback.innerHTML = `
                        <p>⏳ ¿El video no se reproduce?</p>
                        <p style="margin-top:10px;">
                            Haz clic aquí para ir al 
                            <a href="https://espacio-kihnally.ola.click/products">menú de Espacio Kihnally</a>
                        </p>
                    `;
                    fallback.style.display = 'block';
                }
            }
        });

        console.log('🚀 Página de bienvenida cargada.');
    </script>
</body>
</html>
